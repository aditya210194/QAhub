<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - QA Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }
        .offline-container {
            text-align: center;
            max-width: 500px;
        }
        .offline-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: transform 0.3s ease;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .features {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            text-align: left;
        }
        .feature-item {
            background: rgba(255,255,255,0.1);
            padding: 10px 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .feature-item span {
            font-size: 18px;
        }
        @media (max-width: 480px) {
            .features {
                grid-template-columns: 1fr;
            }
            h1 { font-size: 28px; }
        }
    </style>
</head>
<body>
<div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>You're Offline</h1>
    <p>
        Don't worry! You can still access previously viewed content.
        Connect to the internet to see fresh updates.
    </p>
    <button class="btn" onclick="window.location.reload()">
        Try Again
    </button>
    <div class="features">
        <div class="feature-item"><span>✅</span> View cached tutorials</div>
        <div class="feature-item"><span>✅</span> Access saved courses</div>
        <div class="feature-item"><span>✅</span> Read cached articles</div>
        <div class="feature-item"><span>⏳</span> Content updates when online</div>
    </div>
</div>
</body>
</html>
