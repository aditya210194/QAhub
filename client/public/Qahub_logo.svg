<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="360" height="100" role="img" aria-label="QAhub logo">
  <title>QAhub</title>
  <defs>
    <linearGradient id="qahubGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <clipPath id="iconClip">
      <rect x="0" y="0" width="80" height="80" rx="18"/>
    </clipPath>
  </defs>

  <g transform="translate(4,10)">
    <rect class="icon-bg" x="0" y="0" width="80" height="80" rx="18" fill="url(#qahubGradient)"/>
    <g clip-path="url(#iconClip)">
      <path d="M40 12 L65 21 V40 C65 55 54 63 40 68 C26 63 15 55 15 40 V21 Z" fill="#ffffff" opacity="0.95"/>
      <path d="M28 40 L36 48 L52 30" fill="none" stroke="#764ba2" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="98" y="52" font-family="Arial, sans-serif" font-size="42" font-weight="700">
    <tspan class="text-qa" fill="#667eea">QA</tspan><tspan class="text-hub" fill="#764ba2">hub</tspan>
  </text>
  <text class="text-tagline" x="99" y="72" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="url(#qahubGradient)">Test Smart. Ship Better.</text>
</svg>
